# Prospekt reskin config — `manage.py reskin --config prospect.yml` (ADR-012).
#
# FAQAT oʻzgartirmoqchi boʻlgan kalitlarni qoldiring (qisman yangilash). Har bir seksiya
# ixtiyoriy. Ranglar hex boʻlishi shart (#RRGGBB). Rasm yoʻllari config yoniga (yoki
# --assets-dir ga) nisbatan.
#
#   manage.py reskin --config prospect.yml --assets-dir ./prospect-assets
#   manage.py reskin --config prospect.yml --dry-run     # avval koʻrish

# ── Matnli maydonlar UCH TILLI ──
# Ikki shakl mumkin:
#   1) oddiy matn        → uchala tilga (uz/ru/en) bir xil yoziladi — nom, manzil uchun qulay;
#   2) {uz:…, ru:…, en:…} → har til alohida — shior, "biz haqimizda" uchun.
# Til berilmasa, u tildagi ESKI matn qoladi va buyruq ogohlantiradi (rebrand chala qolmasin).
name: "Smile Line Dental"

