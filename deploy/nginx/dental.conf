# dental_demo — nginx reverse proxy (ADR-021).
#   /media/         → volume'dan to'g'ridan-to'g'ri (yuklangan rasmlar)
#   /api /admin /static → Django (gunicorn + WhiteNoise)
#   qolgan hammasi  → Next.js (standalone), /_next/ ham shu yerda
#
# TLS YO'Q (IP demo). Domen olgach: certbot + 443 server bloki qo'shiladi, HTTP→HTTPS
# redirect yoqiladi, so'ng backend `.env.prod` SITE_HTTPS=true va QAYTA build (DEPLOY.md).

upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

# Rasm yuklash uchun (admin) — default 1m yetmaydi.
client_max_body_size 25m;

gzip on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml
           image/svg+xml application/manifest+json;

server {
    listen 80 default_server;
    server_name _;

    # Yuklangan media — volume'dan, backend'ni chetlab. Frontend'ning /media rewrite'i ham
    # (image optimizer uchun) shu yerga tushadi.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Django: API v1 + admin + WhiteNoise static + healthz.
    # DIQQAT: `api/v1` (bare `api` EMAS) — `/api/revalidate` frontend route handler'i, u
    # quyidagi `/` bloki orqali Next'ga tushishi kerak.
    location ~ ^/(api/v1|admin|static|django-static|healthz)/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
    }

    # Qolgan hammasi — Next.js (sahifalar, /_next/, /og-default.png, /manifest.webmanifest…).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
